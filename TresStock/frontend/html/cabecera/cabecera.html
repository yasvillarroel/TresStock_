<!-- TITULO 1 CONTENEDOR CABECERA -->

    <!-- contenedor principal de la cabecera del sistema -->
    <div class="contenedor_principal_cabecera">


        <!-- TITULO 2 TITULO VISTA -->

            <!-- contenedor para mostrar el nombre de la vista actual -->
            <div class="contenedor_titulo_cabecera">

                <!-- texto que muestra el nombre de la vista seleccionada -->
                <div class="titulo_vista_cabecera" id="titulo_vista_cabecera">Dashboard</div>

            </div>


        <!-- TITULO 3 USUARIO -->

            <!-- contenedor para mostrar la información del usuario conectado -->
            <div class="contenedor_usuario_cabecera">

                <!-- contenedor de los datos del usuario -->
                <div class="contenedor_datos_usuario_cabecera">

                    <!-- nombre del usuario conectado -->
                    <div class="nombre_usuario_cabecera" id="nombre_usuario_cabecera">Usuario</div>

                    <!-- rol del usuario conectado -->
                    <div class="rol_usuario_cabecera" id="rol_usuario_cabecera">Administrador</div>

                </div>


                <!-- icono visual del usuario -->
                <div class="icono_usuario_cabecera">U</div>


                <!-- opción para cerrar la sesión -->
                <div class="boton_cerrar_sesion_cabecera" id="boton_cerrar_sesion_cabecera">Cerrar sesión</div>

            </div>


    </div>
