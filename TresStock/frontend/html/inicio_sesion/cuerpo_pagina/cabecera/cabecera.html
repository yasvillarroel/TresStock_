

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | TresStock</title>

    <!-- favicon -->
    <!-- <link rel="icon" type="image/png" href="./imagenes/favicon.png"> -->

    <!-- CSS INICIO SESION -->
    <link rel="stylesheet" href="./css/inicio_sesion/cuerpo_pagina/cabecera/cabecera.css">

</head>
<!-- TITULO 1 CONTENEDOR CABECERA -->

    <!-- contenedor principal de la cabecera del sistema -->
    <div class="contenedor_principal_cabecera">


        <!-- TITULO 2 SECCION IZQUIERDA CABECERA -->

            <!-- contenedor que agrupa el menú responsive y el título de la vista -->
            <div class="contenedor_izquierdo_cabecera">

                <!-- opción para mostrar u ocultar el menú lateral en dispositivos pequeños -->
                <div class="boton_menu_cabecera" id="boton_menu_cabecera">

                    <!-- imagen del icono de menú -->
                    <img class="imagen_boton_menu_cabecera" src="./imagenes/inicio_sesion/cuerpo_pagina/cabecera/menu.svg" alt="Menú">

                </div>

                <!-- texto que muestra el nombre de la vista seleccionada -->
                <div class="titulo_vista_cabecera" id="titulo_vista_cabecera">Dashboard</div>

            </div>


        <!-- TITULO 3 BUSCADOR CABECERA -->

            <!-- contenedor del buscador general del sistema -->
            <div class="contenedor_busqueda_cabecera">

                <!-- icono visual del buscador -->
                <div class="icono_busqueda_cabecera">

                    <!-- imagen del icono de búsqueda -->
                    <img class="imagen_busqueda_cabecera" src="./imagenes/inicio_sesion/cuerpo_pagina/cabecera/search.svg" alt="Buscar">

                </div>

                <!-- campo para realizar búsquedas generales -->
                <input class="input_busqueda_cabecera" id="input_busqueda_cabecera" type="text" placeholder="Buscar productos, ventas, proveedores...">

            </div>


        <!-- TITULO 4 OPCIONES USUARIO -->

            <!-- contenedor que agrupa las opciones relacionadas con el usuario conectado -->
            <div class="contenedor_usuario_cabecera">


                <!-- contenedor de notificaciones -->
                <div class="contenedor_notificaciones_cabecera" id="contenedor_notificaciones_cabecera">

                    <!-- icono visual de notificaciones -->
                    <div class="icono_notificaciones_cabecera">

                        <!-- imagen del icono de notificaciones -->
                        <img class="imagen_notificaciones_cabecera" src="./imagenes/inicio_sesion/cuerpo_pagina/cabecera/bell.svg" alt="Notificaciones">

                    </div>

                </div>


                <!-- contenedor de perfil y opciones desplegables -->
                <div class="contenedor_perfil_usuario_cabecera" id="contenedor_perfil_usuario_cabecera">

                    <!-- boton para abrir el menu desde cualquier parte del perfil -->
                    <button class="boton_perfil_usuario_cabecera" id="boton_perfil_usuario_cabecera"
                        type="button" aria-label="Opciones de cuenta" aria-expanded="false"
                        aria-controls="menu_desplegable_usuario_cabecera">

                        <!-- icono visual del usuario conectado -->
                        <div class="icono_usuario_cabecera" id="icono_usuario_cabecera">
                            <img class="imagen_usuario_cabecera"
                                src="./imagenes/inicio_sesion/cuerpo_pagina/cabecera/user.svg" alt="">
                        </div>

                        <!-- nombre y correo del usuario conectado -->
                        <div class="contenedor_datos_usuario_cabecera">
                            <div class="nombre_usuario_cabecera" id="nombre_usuario_cabecera">Usuario</div>
                            <div class="email_usuario_cabecera" id="email_usuario_cabecera"></div>
                        </div>

                        <!-- indicador de menu -->
                        <div class="boton_usuario_cabecera" id="boton_usuario_cabecera" aria-hidden="true">▾</div>

                    </button>

                    <!-- opciones de la cuenta; oculto hasta presionar perfil -->
                    <div class="menu_desplegable_usuario_cabecera" id="menu_desplegable_usuario_cabecera" hidden>

                        <button class="boton_cerrar_sesion_cabecera" id="boton_cerrar_sesion_cabecera" type="button">

                            <img
                                class="imagen_cerrar_sesion_cabecera"
                                src="./imagenes/inicio_sesion/cuerpo_pagina/cabecera/log-out.svg"
                                alt="Cerrar sesión"
                            >
                            Cerrar sesión
                        </button>

                    </div>

                </div>

            </div>


    </div>
