

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | TresStock</title>

    <!-- favicon -->
    <!-- <link rel="icon" type="image/png" href="./imagenes/favicon.png"> -->

    <!-- CSS INICIO SESION -->
    <link rel="stylesheet" href="./css/inicio_sesion/cuerpo_pagina/menu_lateral/menu_lateral.css">

</head>
<body>
<!-- TITULO 1 CONTENEDOR MENU LATERAL -->

    <!-- contenedor principal del menú lateral del sistema -->
    <div class="contenedor_menu_lateral">


        <!-- TITULO 2 IDENTIDAD TRESSTOCK -->

            <!-- contenedor para mostrar la identidad visual de TresStock -->
            <div class="contenedor_identidad_menu_lateral">

                <!-- imagen del logo principal de TresStock -->
                <img class="imagen_logo_menu_lateral" src="./imagenes/inicio_sesion/cuerpo_pagina/menu_lateral/menu_lateral_img1.png" alt="Logo TresStock">

                <!-- descripción breve del sistema -->
                <div class="descripcion_logo_menu_lateral">Gestión inteligente de inventario</div>

            </div>


        <!-- TITULO 3 OPCIONES MENU LATERAL -->

            <!-- contenedor que agrupa las opciones de navegación -->
            <div class="contenedor_opciones_menu_lateral">


                <!-- opción para acceder al dashboard -->
                <div class="opcion_dashboard_menu opcion_menu_activa" id="opcion_dashboard_menu" onclick="seleccionarOpcionMenu('dashboard')">

                    <div class="icono_dashboard_menu">

                        <img class="imagen_icono_dashboard_menu" src="./imagenes/inicio_sesion/cuerpo_pagina/menu_lateral/layout-dashboard.svg" alt="Dashboard">

                    </div>

                    <div class="texto_dashboard_menu">Dashboard</div>

                </div>


                <!-- opción para acceder al inventario -->
                <div class="opcion_inventario_menu" id="opcion_inventario_menu" onclick="seleccionarOpcionMenu('inventario')">

                    <div class="icono_inventario_menu">

                        <img class="imagen_icono_inventario_menu" src="./imagenes/inicio_sesion/cuerpo_pagina/menu_lateral/boxes.svg" alt="Inventario">

                    </div>

                    <div class="texto_inventario_menu">Inventario</div>

                </div>


                <!-- opción para acceder a productos -->
                <div class="opcion_productos_menu" id="opcion_productos_menu" onclick="seleccionarOpcionMenu('productos')">

                    <div class="icono_productos_menu">

                        <img class="imagen_icono_productos_menu" src="./imagenes/inicio_sesion/cuerpo_pagina/menu_lateral/package.svg" alt="Productos">

                    </div>

                    <div class="texto_productos_menu">Productos</div>

                </div>


                <!-- opción para acceder a ventas -->
                <div class="opcion_ventas_menu" id="opcion_ventas_menu" onclick="seleccionarOpcionMenu('ventas')">

                    <div class="icono_ventas_menu">

                        <img class="imagen_icono_ventas_menu" src="./imagenes/inicio_sesion/cuerpo_pagina/menu_lateral/shopping-cart.svg" alt="Ventas">

                    </div>

                    <div class="texto_ventas_menu">Ventas</div>

                </div>


                <!-- opción para acceder a proveedores -->
                <div class="opcion_proveedores_menu" id="opcion_proveedores_menu" onclick="seleccionarOpcionMenu('proveedores')">

                    <div class="icono_proveedores_menu">

                        <img class="imagen_icono_proveedores_menu" src="./imagenes/inicio_sesion/cuerpo_pagina/menu_lateral/truck.svg" alt="Proveedores">

                    </div>

                    <div class="texto_proveedores_menu">Proveedores</div>

                </div>


                <!-- opción para acceder a importación -->
                <div class="opcion_importacion_menu" id="opcion_importacion_menu" onclick="seleccionarOpcionMenu('importacion')">

                    <div class="icono_importacion_menu">

                        <img class="imagen_icono_importacion_menu" src="./imagenes/inicio_sesion/cuerpo_pagina/menu_lateral/file-up.svg" alt="Importación">

                    </div>

                    <div class="texto_importacion_menu">Importación</div>

                </div>


                <!-- opción para acceder a alertas y vencimientos -->
                <div class="opcion_alertas_menu" id="opcion_alertas_menu" onclick="seleccionarOpcionMenu('alertas')">

                    <div class="icono_alertas_menu">

                        <img class="imagen_icono_alertas_menu" src="./imagenes/inicio_sesion/cuerpo_pagina/menu_lateral/triangle-alert.svg" alt="Alertas">

                    </div>

                    <div class="texto_alertas_menu">Alertas</div>

                </div>


                <!-- opción para acceder a análisis, predicciones y recomendaciones -->
                <div class="opcion_analisis_menu" id="opcion_analisis_menu" onclick="seleccionarOpcionMenu('analisis')">

                    <div class="icono_analisis_menu">

                        <img class="imagen_icono_analisis_menu" src="./imagenes/inicio_sesion/cuerpo_pagina/menu_lateral/chart-spline.svg" alt="Análisis">

                    </div>

                    <div class="texto_analisis_menu">Análisis</div>

                </div>


                <!-- opción para acceder a la administración de usuarios -->
                <div class="opcion_administracion_menu" id="opcion_administracion_menu" onclick="seleccionarOpcionMenu('administracion')">

                    <div class="icono_administracion_menu">

                        <img class="imagen_icono_administracion_menu" src="./imagenes/inicio_sesion/cuerpo_pagina/menu_lateral/user-round-group.svg" alt="Administración">

                    </div>

                    <div class="texto_administracion_menu">Administración</div>

                </div>


            </div>


    </div>

    <script src="./js/inicio_sesion/cuerpo_pagina/menu_lateral/menu_lateral.js"></script>
</body>
