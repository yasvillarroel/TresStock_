<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | TresStock</title>

    <!-- favicon -->
    <!-- <link rel="icon" type="image/png" href="../../imagenes/favicon.png"> -->

    <!-- CSS INICIO SESION -->
    <link rel="stylesheet" href="../../css/inicio_sesion/inicio_sesion.css">

</head>


<body class="body_inicio_sesion">


    <!-- TITULO 1 CONTENEDOR INICIO SESION -->

        <!-- contenedor principal de la pantalla de inicio de sesión -->
        <div class="contenedor_inicio_sesion">


            <!-- TITULO 2 IDENTIDAD TRESSTOCK -->

                <!-- contenedor izquierdo para mostrar la identidad visual del sistema -->
                <div class="contenedor_identidad_inicio_sesion">

                    <!-- imagen principal del logo de TresStock -->
                    <img class="imagen_logo_inicio_sesion" src="../../imagenes/inicio_sesion/inicio_sesion_img1.png" alt="Logo TresStock">

                    <!-- título descriptivo del sistema -->
                    <div class="titulo_identidad_inicio_sesion">Gestión inteligente de inventario</div>

                    <!-- descripción breve del sistema -->
                    <div class="descripcion_identidad_inicio_sesion">Controla productos, inventario, proveedores y ventas desde un solo lugar.</div>

                </div>


            <!-- TITULO 3 ACCESO TRESSTOCK -->

                <!-- contenedor derecho para mostrar el formulario de acceso -->
                <div class="contenedor_acceso_inicio_sesion">


                    <!-- formulario para ingresar al sistema -->
                    <form class="formulario_inicio_sesion" id="formulario_inicio_sesion">


                        <!-- TITULO 4 ENCABEZADO FORMULARIO -->

                            <!-- contenedor del título y descripción del formulario -->
                            <div class="contenedor_encabezado_inicio_sesion">

                                <!-- título principal del formulario -->
                                <div class="titulo_inicio_sesion">Iniciar sesión</div>

                                <!-- descripción del formulario -->
                                <div class="descripcion_inicio_sesion">Ingresa tus credenciales para acceder a TresStock.</div>

                            </div>


                        <!-- TITULO 5 CORREO ELECTRONICO -->

                            <!-- contenedor del campo correo electrónico -->
                            <div class="campo_email_inicio_sesion">

                                <!-- texto descriptivo del campo -->
                                <div class="texto_email_inicio_sesion">Correo electrónico</div>

                                <!-- campo para ingresar el correo -->
                                <input class="input_email_inicio_sesion" id="email" type="email" placeholder="usuario@tresstock.cl" autocomplete="email">

                            </div>


                        <!-- TITULO 6 CONTRASEÑA -->

                            <!-- contenedor del campo contraseña -->
                            <div class="campo_contrasena_inicio_sesion">

                                <!-- texto descriptivo del campo -->
                                <div class="texto_contrasena_inicio_sesion">Contraseña</div>


                                <!-- contenedor del campo contraseña y opción mostrar -->
                                <div class="contenedor_input_contrasena_inicio_sesion">

                                    <!-- campo para ingresar la contraseña -->
                                    <input class="input_contrasena_inicio_sesion" id="contrasena" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">

                                    <!-- opción para mostrar u ocultar la contraseña -->
                                    <div class="boton_mostrar_contrasena_inicio_sesion" id="boton_mostrar_contrasena_inicio_sesion" onclick="mostrarOcultarContrasena()"> Mostrar </div>

                                </div>

                            </div>


                        <!-- TITULO 7 RECORDAR SESION -->

                            <!-- contenedor de la opción recordar sesión -->
                            <div class="contenedor_recordar_inicio_sesion">

                                <!-- selector para recordar la sesión -->
                                <input class="checkbox_recordar_inicio_sesion" id="recordar_inicio_sesion" type="checkbox">

                                <!-- texto de la opción recordar sesión -->
                                <div class="texto_recordar_inicio_sesion">Recordarme</div>

                            </div>


                        <!-- TITULO 8 MENSAJE INICIO SESION -->

                            <!-- espacio para mostrar mensajes enviados por la validación o backend -->
                            <div class="mensaje_login" id="mensaje_login"></div>


                        <!-- TITULO 9 BOTON INICIO SESION -->

                            <!-- opción para enviar el formulario de inicio de sesión -->
                            <div class="boton_inicio_sesion" id="boton_inicio_sesion">

                                <div class="texto_boton_inicio_sesion">Ingresar</div>

                            </div>


                        <!-- TITULO 10 INFORMACION INFERIOR -->

                            <!-- texto informativo del sistema -->
                            <div class="texto_inferior_inicio_sesion">Sistema de gestión y control de inventario TresStock</div>

                    </form>

                </div>

        </div>

    <!-- JS INICIO SESION -->
    <script src="../../js/inicio_sesion/inicio_sesion.js"></script>


</body>

</html>
