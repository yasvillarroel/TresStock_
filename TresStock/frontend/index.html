<!-- Registro del Service Worker de TresStock -->
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
            try {
                const registro = await navigator.serviceWorker.register(
                    "./service-worker.js"
                );

                console.log(
                    "Service Worker de TresStock registrado:",
                    registro.scope
                );
            } catch (error) {
                console.error(
                    "Error al registrar Service Worker:",
                    error
                );
            }
        });
    }
</script>
