<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>inicio_sesion</title>

    <link rel="stylesheet" href="../../css/inicio_sesion/inicio_sesion.css">

</head>

<body>

    <div class="contenedor_inicio_sesion">

        <div>inicio_sesion</div>

        <form id="formulario_inicio_sesion">

            <label for="email">Correo</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="contrasena">Contrasena</label>

            <input
                type="password"
                id="contrasena"
                name="contrasena"
                required
            >

            <div class="boton_inicio_sesion" id="boton_inicio_sesion">
                Iniciar sesion
            </div>

        </form>

        <div id="mensaje_login"></div>

    </div>

    <script src="../../js/inicio_sesion/inicio_sesion.js"></script>

</body>

</html>
